<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zhehao Li — moved to li-zhehao.github.io</title>

  <!-- Served by GitHub Pages for any path that does not exist in this repo,
       so old deep links (e.g. /DiffFR) land here and get forwarded. -->
  <link rel="canonical" href="https://li-zhehao.github.io/">
  <meta name="robots" content="noindex, follow">

  <!-- Fallback if JavaScript is off: send visitors to the new home page -->
  <meta http-equiv="refresh" content="0; url=https://li-zhehao.github.io/">

  <!-- Keep the path, so /DiffFR goes to li-zhehao.github.io/DiffFR -->
  <script>
    (function () {
      var target = 'https://li-zhehao.github.io' +
        window.location.pathname + window.location.search + window.location.hash;
      window.location.replace(target);
    })();
  </script>

  <style>
    :root {
      color-scheme: light dark;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --bg: #fff;
      --link: #416b8e;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #dee2e6;
        --muted: #9aa0a6;
        --bg: #212529;
        --link: #7fb0d8;
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin: 0 0 0.5rem;
    }

    p {
      margin: 0 0 0.75rem;
      color: var(--muted);
    }

    a {
      color: var(--link);
      font-weight: 600;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <main>
    <h1>This page has moved</h1>
    <p>Zhehao Li's site is now at</p>
    <p><a id="target" href="https://li-zhehao.github.io/">li-zhehao.github.io</a></p>
    <p>You should be redirected automatically. If not, use the link above.</p>
  </main>

  <script>
    // point the visible link at the same path too
    (function () {
      var a = document.getElementById('target');
      if (a) {
        a.href = 'https://li-zhehao.github.io' +
          window.location.pathname + window.location.search + window.location.hash;
      }
    })();
  </script>
</body>

</html>
